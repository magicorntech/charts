---
# Source: charts-statefulset/charts/charts-common-statefulset/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-statefulset
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-statefulset-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-statefulset
    app.kubernetes.io/instance: ci-statefulset
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # StatefulSet specific: serviceName is required for stable network identity
  serviceName: ci-statefulset-headless
  # StatefulSet specific: podManagementPolicy controls how pods are created/deleted
  # Default is OrderedReady, which ensures pods are created/deleted in order
  podManagementPolicy: OrderedReady
  # StatefulSet specific: updateStrategy for rolling updates
  # Default RollingUpdate with partition: 0 for immediate updates
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-statefulset
      app.kubernetes.io/instance: ci-statefulset
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-statefulset
        app.kubernetes.io/instance: ci-statefulset
    spec:
      securityContext:
        {}

      containers:
        - name: ci-statefulset
          image: "registry.example.com/app:1.0.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: one
              containerPort: 80
              protocol: TCP
          volumeMounts:
            # StatefulSet specific: volumeMounts for persistent storage
            # Each pod will get its own PVC based on volumeClaimTemplates
            - name: storage
              mountPath: "/data"
              subPath: ""
              readOnly: false
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          env:
            []
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30

  # StatefulSet specific: volumeClaimTemplates for persistent storage
  # Each pod will get its own PVC: <statefulset-name>-<pod-ordinal>-<template-name>
  volumeClaimTemplates:
  - metadata:
      name: storage
      labels:
        helm.sh/chart: charts-common-statefulset-0.0.1
        k8s.magicorn.net/chart-version: 0.0.1
        app.kubernetes.io/name: ci-statefulset
        app.kubernetes.io/instance: ci-statefulset
        app.kubernetes.io/version: "0.0.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: "gp2"

---
# Source: charts-statefulset/charts/charts-common/templates/ingress-aws.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-statefulset
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-statefulset
    app.kubernetes.io/instance: ci-statefulset
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:000000000000:certificate/00000000-0000-0000-0000-000000000000"
    alb.ingress.kubernetes.io/group.name: "minimal-lb"
    alb.ingress.kubernetes.io/group.order: '100'
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '10'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60, deletion_protection.enabled=true
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  ingressClassName: alb
  rules:
    - host: "minimal.example.com"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: ci-statefulset
                port:
                  number: 80
