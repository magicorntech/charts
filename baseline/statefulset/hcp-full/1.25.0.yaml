# Source: charts-statefulset/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ci-statefulset
  namespace: "ci"
  labels:
    helm.sh/chart: charts-statefulset-1.2.0
    k8s.magicorn.net/chart-version: 1.2.0
    app.kubernetes.io/name: ci-statefulset
    app.kubernetes.io/instance: ci-statefulset
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  # StatefulSet specific: serviceName is required for stable network identity
  serviceName: ci-statefulset-headless
  # StatefulSet specific: podManagementPolicy controls how pods are created/deleted
  # Default is OrderedReady, which ensures pods are created/deleted in order
  podManagementPolicy: OrderedReady
  # StatefulSet specific: updateStrategy for rolling updates
  # Default RollingUpdate with partition: 0 for immediate updates
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-statefulset
      app.kubernetes.io/instance: ci-statefulset
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app.kubernetes.io/name: ci-statefulset
        app.kubernetes.io/instance: ci-statefulset
    spec:
      imagePullSecrets:
        - name: regcred
      serviceAccountName: ci-statefulset
      securityContext:
        {}
      volumes:
        - name: app-config
          configMap:
            name: "app-config"
            items:
              - key: ".env.prod"
                path: ".env.prod"
            defaultMode: 420

      containers:
        - name: ci-statefulset
          image: "registry.example.com/app:1.0.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: one
              containerPort: 80
              protocol: TCP
            - name: two
              containerPort: 443
              protocol: TCP
          volumeMounts:
            # StatefulSet specific: volumeMounts for persistent storage
            # Each pod will get its own PVC based on volumeClaimTemplates
            - name: storage
              mountPath: "/data"
              subPath: ""
              readOnly: false
            - name: app-config
              readOnly: true
              mountPath: "/var/www/html"
              subPath: ".env.prod"
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 15
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 30
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          env:
            - name: foo
              value: bar
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -c
                - sleep 60
          securityContext:
            {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        -
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ci-statefulset
              app.kubernetes.io/instance: ci-statefulset

  # StatefulSet specific: volumeClaimTemplates for persistent storage
  # Each pod will get its own PVC: <statefulset-name>-<pod-ordinal>-<template-name>
  volumeClaimTemplates:
  - metadata:
      name: storage
      labels:
        helm.sh/chart: charts-statefulset-1.2.0
        k8s.magicorn.net/chart-version: 1.2.0
        app.kubernetes.io/name: ci-statefulset
        app.kubernetes.io/instance: ci-statefulset
        app.kubernetes.io/version: "0.0.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: "gp2"

