apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ci-deployment
  namespace: "ci"
  labels:
    helm.sh/chart: charts-deployment-1.2.0
    k8s.magicorn.net/chart-version: 1.2.0
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ci-deployment
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Percent
        value: 25
      selectPolicy: Min
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 4
      selectPolicy: Max
      stabilizationWindowSeconds: 60

