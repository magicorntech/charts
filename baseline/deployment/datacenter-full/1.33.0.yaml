# Source: charts-deployment/charts/charts-common/templates/cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-deployment-cron1
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: ci-deployment-cron1
            cron: cron1
        spec:
          imagePullSecrets:
            - name: regcred
          serviceAccountName: ci-deployment
          securityContext:
            {}
          volumes:
            - name: app-config
              configMap:
                name: app-config
                items:
                  - key: .env.prod
                    path: .env.prod
                defaultMode: 420
          containers:
          - name: cron1
            image: "registry.example.com/app:1.0.0"
            imagePullPolicy: IfNotPresent
            env:
            - name: foo
              value: bar
            command: [/usr/local/bin/php artisan schedule:run]
            args: 
            - --no-interaction
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 256Mi
            volumeMounts:
              - name: app-config
                readOnly: true
                mountPath: /var/www/html
                subPath: .env.prod
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler

