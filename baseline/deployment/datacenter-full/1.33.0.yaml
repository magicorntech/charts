# Source: charts-deployment/charts/charts-common-deployment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-deployment
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-deployment-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 25
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-deployment
      app.kubernetes.io/instance: ci-deployment
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        app.kubernetes.io/name: ci-deployment
        app.kubernetes.io/instance: ci-deployment
    spec:
      imagePullSecrets:
        - name: regcred
      serviceAccountName: ci-deployment
      securityContext:
        {}
      volumes:
        - name: app-config
          configMap:
            name: app-config
            items:
              - key: .env.prod
                path: .env.prod
            defaultMode: 420
        - name: storage
          persistentVolumeClaim:
            claimName: ci-deployment-pvc

      containers:
        - name: ci-deployment
          image: "registry.example.com/app:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: one
              containerPort: 80
              protocol: TCP
            - name: two
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: app-config
              readOnly: true
              mountPath: /var/www/html
              subPath: .env.prod
            - name: storage
              mountPath: /efs/test
              subPath: test
              readOnly: false
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 15
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 30
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          env:
            - name: foo
              value: bar
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -c
                - sleep 60
          securityContext:
            {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ci-deployment
              app.kubernetes.io/instance: ci-deployment
