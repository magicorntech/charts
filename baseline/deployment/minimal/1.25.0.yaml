# Source: charts-deployment/charts/charts-common/templates/service-aws.yaml
apiVersion: v1
kind: Service
metadata:
  name: ci-deployment
  namespace: "ci"
  annotations:
  labels:
    helm.sh/chart: charts-common-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  type: "ClusterIP"
  ports:
    - name: one
      targetPort: 80
      port: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment

---
# Source: charts-deployment/charts/charts-common-deployment/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-deployment
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-deployment-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-deployment
      app.kubernetes.io/instance: ci-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-deployment
        app.kubernetes.io/instance: ci-deployment
    spec:
      securityContext:
        {}

      containers:
        - name: ci-deployment
          image: "registry.example.com/app:1.0.0"
          imagePullPolicy: "IfNotPresent"
          ports:
            - name: one
              containerPort: 80
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: one
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          env:
            []
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
# Source: charts-deployment/charts/charts-common/templates/ingress-aws.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-deployment
  namespace: "ci"
  labels:
    helm.sh/chart: charts-common-0.0.1
    k8s.magicorn.net/chart-version: 0.0.1
    app.kubernetes.io/name: ci-deployment
    app.kubernetes.io/instance: ci-deployment
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-1:000000000000:certificate/00000000-0000-0000-0000-000000000000"
    alb.ingress.kubernetes.io/group.name: "minimal-lb"
    alb.ingress.kubernetes.io/group.order: '100'
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '10'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60, deletion_protection.enabled=true
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/ssl-policy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  ingressClassName: alb
  rules:
    - host: "minimal.example.com"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: ci-deployment
                port:
                  number: 80
