suite: secrets gcp (SecretProviderClass + Deployment volume wiring)
templates:
  - charts/charts-common/templates/secrets-gcp.yaml
  - charts/charts-common-deployment/templates/deployment.yaml
values:
  - ../../ci/scenarios/deployment/gcp-full.yaml
tests:
  - it: gcp + enabled renders a SecretProviderClass with the configured secret
    asserts:
      - isAPIVersion:
          of: secrets-store.csi.x-k8s.io/v1
        template: charts/charts-common/templates/secrets-gcp.yaml
      - isKind:
          of: SecretProviderClass
        template: charts/charts-common/templates/secrets-gcp.yaml
      - equal:
          path: spec.provider
          value: gke
        template: charts/charts-common/templates/secrets-gcp.yaml
      - matchRegex:
          path: spec.parameters.secrets
          pattern: 'resourceName: "projects/example/secrets/example/versions/latest"'
        template: charts/charts-common/templates/secrets-gcp.yaml

  - it: gcp + enabled wires the gcpsecrets CSI volume and a mount into the Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gcpsecrets
            csi:
              driver: secrets-store-gke.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: RELEASE-NAME
        template: charts/charts-common-deployment/templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gcpsecrets
            mountPath: /opt/app/.env
            subPath: .env
            readOnly: true
        template: charts/charts-common-deployment/templates/deployment.yaml

  - it: NEGATIVE - aws + secrets.enabled true renders no SecretProviderClass and no gcpsecrets volume
    set:
      global.destination: aws
      global.secrets.enabled: true
    asserts:
      - hasDocuments:
          count: 0
        template: charts/charts-common/templates/secrets-gcp.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gcpsecrets
        template: charts/charts-common-deployment/templates/deployment.yaml

  - it: gcp + disabled renders neither the CRD nor the volume
    set:
      global.secrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: charts/charts-common/templates/secrets-gcp.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gcpsecrets
        template: charts/charts-common-deployment/templates/deployment.yaml
