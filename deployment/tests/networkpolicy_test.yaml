suite: networkPolicy (deployment umbrella — optional, opt-in)
templates:
  - templates/networkpolicy.yaml
values:
  - ../../ci/scenarios/deployment/aws-full.yaml
tests:
  - it: disabled renders nothing
    set:
      global.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: enabled renders a NetworkPolicy named after the release
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: selects the release's own pods (same labels as the workload)
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: RELEASE-NAME
            app.kubernetes.io/instance: RELEASE-NAME

  - it: ingress rules are passed through verbatim (ipBlock with except, namespaceSelector, ports)
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 10.0.0.0/21
      - equal:
          path: spec.ingress[0].from[0].ipBlock.except
          value: [10.0.1.5/32]
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 80
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: prometheus
      - notExists:
          path: spec.egress

  - it: an empty ingress list is a real value, not unset (deny all inbound)
    set:
      global.networkPolicy.ingress: []
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - notExists:
          path: spec.ingress

  - it: egress alone controls only Egress
    set:
      global.networkPolicy.ingress: null
      global.networkPolicy.egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
          ports:
            - protocol: TCP
              port: 443
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Egress]
      - equal:
          path: spec.egress[0].ports[0].port
          value: 443
      - notExists:
          path: spec.ingress

  - it: ingress and egress together control both directions
    set:
      global.networkPolicy.egress: []
    asserts:
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]

  - it: enabled with neither ingress nor egress fails with a clear message
    set:
      global.networkPolicy.ingress: null
      global.networkPolicy.egress: null
    asserts:
      - failedTemplate:
          errorMessage: "global.networkPolicy.enabled is true but neither ingress nor egress is set (use ingress: [] to deny all inbound traffic)"

  - it: works unchanged with an Argo Rollout (same pod labels)
    set:
      global.deployment.enabled: false
      global.rollout.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: RELEASE-NAME
