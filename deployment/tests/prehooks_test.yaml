suite: prehooks (migrations + other-prehooks)
templates:
  - templates/migrations.yaml
  - templates/other-prehooks.yaml
values:
  - ../../ci/scenarios/deployment/aws-full.yaml
tests:
  # These weight assertions double as the stale-vendored-.tgz tripwire: an
  # old committed tarball had migrations at "-1" and other-prehooks at
  # "-2" (inverted order) with no hook annotations at all on several
  # RBAC/secrets objects — if a stale artifact ever gets rendered instead
  # of source, this is the first thing to go red.
  - it: migrations runs before other-prehooks (hook-weight -100 vs -90)
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-100"
        template: templates/migrations.yaml
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-90"
        template: templates/other-prehooks.yaml

  - it: both are pre-install,pre-upgrade hooks with hook-succeeded delete policy
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        template: templates/migrations.yaml
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded
        template: templates/migrations.yaml

  - it: migrations job name and command/args
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-migrations
        template: templates/migrations.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/usr/local/bin/python"]
        template: templates/migrations.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["manage.py", "migrate", "--noinput"]
        template: templates/migrations.yaml

  - it: FIXED (B11) - the container name is the release name, not the chart name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: RELEASE-NAME
        template: templates/migrations.yaml

  - it: both disabled renders neither job
    set:
      global.prehooks.dbMigrations.enabled: false
      global.prehooks.otherPrehooks.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/migrations.yaml
      - hasDocuments:
          count: 0
        template: templates/other-prehooks.yaml

  - it: gcp secrets volume mounts into the migrations job when destination is gcp and secrets are enabled
    set:
      global.destination: gcp
      global.secrets.enabled: true
      global.secrets.mountPath: /opt/app
      global.secrets.data:
        - resourceName: "projects/example/secrets/example/versions/latest"
          fileName: ".env"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gcpsecrets
            csi:
              driver: secrets-store-gke.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: RELEASE-NAME
        template: templates/migrations.yaml

  - it: NEW (P4) - configMap mount uses subPath by default in both migrations and other-prehooks
    set:
      global.prehooks.otherPrehooks.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: .env.prod
        template: templates/migrations.yaml
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: .env.prod
        template: templates/other-prehooks.yaml

  - it: NEW (P4) - useSubPath=false drops subPath from the configMap mount in both
    set:
      global.prehooks.otherPrehooks.enabled: true
      global.configMap.useSubPath: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
        template: templates/migrations.yaml
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
        template: templates/other-prehooks.yaml

  - it: NEW (P6) - k8sSecrets.common injects a secretKeyRef env var into both migrations and other-prehooks
    set:
      global.prehooks.otherPrehooks.enabled: true
      global.k8sSecrets.common.enabled: true
      global.k8sSecrets.common.secretName: shared-secrets
      global.k8sSecrets.common.keys:
        - key: API_KEY
          envName: API_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: shared-secrets
                key: API_KEY
        template: templates/migrations.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: shared-secrets
                key: API_KEY
        template: templates/other-prehooks.yaml
