suite: startupProbe (global.deployment.startup — Deployment and Argo Rollout)
templates:
  - templates/deployment.yaml
  - templates/rollout.yaml
values:
  - ../../ci/scenarios/deployment/aws-full.yaml
tests:
  - it: unset by default — no startupProbe, readiness/liveness untouched
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: an empty startup map renders no startupProbe
    template: templates/deployment.yaml
    set:
      global.deployment.startup: {}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: renders the Probe verbatim next to readiness and liveness
    template: templates/deployment.yaml
    set:
      global.deployment.startup:
        httpGet:
          port: one
          path: /healthz
        periodSeconds: 5
        failureThreshold: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              port: one
              path: /healthz
            periodSeconds: 5
            failureThreshold: 60
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz

  - it: any other Probe handler works too (tcpSocket, exec, grpc)
    template: templates/deployment.yaml
    set:
      global.deployment.startup:
        tcpSocket:
          port: 5432
        periodSeconds: 10
        failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: the Argo Rollout pod template gets it too (shared template)
    template: templates/rollout.yaml
    set:
      global.deployment.enabled: false
      global.rollout.enabled: true
      global.deployment.startup:
        httpGet:
          port: one
          path: /ready
        failureThreshold: 20
        periodSeconds: 3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /ready
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 20

  - it: setting startup does not change the load balancer health check (still driven by liveness)
    template: templates/deployment.yaml
    set:
      global.deployment.startup:
        httpGet:
          port: one
          path: /somewhere-else
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
