{{- if eq .Values.destination "gcp" }}
{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "charts-deployment.name" . }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "charts-deployment.labels" . | nindent 4 }}
spec:
  parameters:
    secrets: |
      {{- range $index, $secret := .Values.secrets.data }}
      - resourceName: "{{ $secret.resourceName }}"
      {{- end }}
  provider: gke
  secretObjects:
  - secretName: {{ include "charts-deployment.name" . }}-gcp-secrets
    type: Opaque
    data:
    {{- range $index, $secret := .Values.secrets.data }}
    - key: {{ $secret.envKey }}
      objectName: {{ $secret.resourceName }}
    {{- end }}
{{- end }}
{{- end }}
