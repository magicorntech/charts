{{- if eq .Values.destination "gcp" }}
{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "charts-deployment.name" . }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "charts-deployment.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "{{ .Values.secrets.resourceName }}"
        fileName: "secrets.json"
        {{- if .Values.secrets.keys }}
        jmesPath:
          {{- range .Values.secrets.keys }}
          - path: "{{ . }}"
            objectAlias: "{{ . }}"
          {{- end }}
        {{- end }}
  secretObjects:
  - secretName: {{ include "charts-deployment.name" . }}-gcp-secrets
    type: Opaque
    data:
    {{- range .Values.secrets.keys }}
    - key: {{ . }}
      objectName: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
