# aws-full.yaml with an exec liveness probe instead of httpGet — added
# specifically for ci/gate.sh's cmd_exec_probe_guard, which proves
# ingress-aws.yaml's ALB healthcheck-path annotation degrades safely
# (bug B9) instead of nil-pointering. It also flows through the ordinary
# render/lint/kubeconform matrix like the other scenarios, since it's a
# perfectly valid config in its own right, not just a regression probe.
global:
  destination: aws
  deployment:
    image:
      uri: registry.example.com/app:1.0.0
      pullPolicy: IfNotPresent
      imagePullSecrets: []
    env: []
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
    readiness:
      httpGet:
        port: one
        path: /healthz
      failureThreshold: 2
      initialDelaySeconds: 5
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
    liveness:
      exec:
        command: ["cat", "/tmp/healthy"]
      failureThreshold: 2
      initialDelaySeconds: 10
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 5
    podAnnotations: {}
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    lifecycle: {}
    deregistrationTime: 30
    failSeconds: 300
    revisionHistory: 5
    nodeSelector: {}
    affinity: {}
    tolerations: []
    topologySpreadConstraints: []
  service:
    enabled: true
    annotations: {}
    type: ClusterIP
    ports:
      one:
        inner: 80
        outer: 80
  ingress:
  - enabled: true
    annotations: {}
    className: null
    idleTimeout: 60
    scheme: internet-facing
    certificateId: arn:aws:acm:eu-west-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
    wafId: null
    sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    lbId: exec-probe-lb
    lbOrder: 100
    hosts:
    - host: exec-probe.example.com
      paths:
      - path: /
        pathType: Prefix
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 0
    behavior: {}
  configMap:
    enabled: false
    name: ""
    fileName: ""
    mountPath: ""
  prehooks:
    dbMigrations:
      enabled: false
      command: []
      args: []
    otherPrehooks:
      enabled: false
      command: []
      args: []
  cronjobs: []
  security:
    serviceAccount:
      enabled: false
      annotations: {}
      clusterWideAccess: false
      rules: []
    sgPolicy:
      enabled: false
      securityGroupId: ""
    podSecurityContext: {}
    securityContext: {}
  pvc:
    enabled: false
    mountPath: ""
    subPath: ""
    size: ""
    accessModes: []
    storageClass: ""
  secrets:
    enabled: false
    mountPath: ""
    data: []
