suite: ingress gcp
templates:
  - charts/charts-common/templates/ingress-gcp.yaml
values:
  - ../../ci/scenarios/statefulset/gcp-full.yaml
tests:
  - it: className flows through to ingressClassName
    asserts:
      - equal:
          path: spec.ingressClassName
          value: gce

  - it: className null renders an empty/null ingressClassName (today's unquoted behavior)
    set:
      global.ingress:
        - enabled: true
          annotations: {}
          className: null
          idleTimeout: 60
          scheme: internet-facing
          certificateId: arn:example
          wafId: null
          sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
          lbId: lb
          lbOrder: 100
          hosts:
            - host: hostname.example
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - isNullOrEmpty:
          path: spec.ingressClassName

  - it: tls block renders when the ingress entry sets tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: hostname-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: hostname.example

  - it: tls block is absent when the ingress entry has no tls
    set:
      global.ingress:
        - enabled: true
          annotations: {}
          className: gce
          idleTimeout: 60
          scheme: internet-facing
          certificateId: arn:example
          wafId: null
          sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
          lbId: lb
          lbOrder: 100
          hosts:
            - host: hostname.example
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - notExists:
          path: spec.tls

  - it: renders only user-supplied annotations, no platform-injected ones
    set:
      global.ingress:
        - enabled: true
          annotations:
            team: platform
          className: gce
          idleTimeout: 60
          scheme: internet-facing
          certificateId: arn:example
          wafId: null
          sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
          lbId: lb
          lbOrder: 100
          hosts:
            - host: hostname.example
              paths:
                - path: /
                  pathType: Prefix
    asserts:
      - equal:
          path: metadata.annotations
          value:
            team: platform
