suite: service (aws/gcp/hcp/datacenter)
templates:
  - templates/service.yaml
  - templates/service.yaml
  - templates/service.yaml
  - templates/service.yaml
values:
  - ../../ci/scenarios/statefulset/aws-full.yaml
# NOT tested here: a user annotation colliding with one of the 9 hardcoded
# NLB keys (e.g. re-setting aws-load-balancer-type). Today that produces a
# literal duplicate YAML key and a hard unmarshal error, not "user wins" —
# there is no real precedence today, just a raw text splice with no
# collision handling. "User wins" only becomes true, and testable, once
# Phase 4 replaces the splice with a real `merge (dict) $user $plat`.
tests:
  - it: aws + ClusterIP renders no NLB annotations
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
      - notExists:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]

  - it: FIXED (B2) - aws + LoadBalancer with empty annotations renders the 9 NLB keys and parses as valid YAML (used to crash on a bare {} spliced mid-map)
    template: templates/service.yaml
    set:
      global.service.type: LoadBalancer
      global.service.annotations: {}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: external
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-attributes"]
          value: "load_balancing.cross_zone.enabled=false, deletion_protection.enabled=true"

  - it: aws + LoadBalancer with real annotations renders the 9 NLB keys plus the user's own
    set:
      global.service.type: LoadBalancer
      global.service.annotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]
          value: external
      - equal:
          path: metadata.annotations["team"]
          value: platform
    template: templates/service.yaml

  - it: type None renders ClusterIP with clusterIP None (headless)
    set:
      global.service.type: None
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.clusterIP
          value: None
    template: templates/service.yaml

  - it: disabled service renders nothing on any destination
    set:
      global.service.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml

  - it: gcp/hcp/datacenter never emit NLB annotations, only user-supplied ones
    set:
      global.destination: gcp
      global.service.annotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations
          value:
            team: platform
    template: templates/service.yaml
