suite: bare defaults (no -f at all)
# B1's permanent regression test for the statefulset umbrella. Unlike the
# deployment chart's PVC (optional, gated on .enabled), the StatefulSet
# has no pvc.yaml template at all — its per-pod storage lives inline as
# volumeClaimTemplates on the StatefulSet object itself and is always
# present, matching the README's "PVC is mandatory for StatefulSet".
templates:
  - templates/statefulset.yaml
  - templates/service.yaml
  - templates/service.yaml
  - templates/service.yaml
  - templates/service.yaml
  - templates/ingress.yaml
  - templates/ingress.yaml
  - templates/ingress.yaml
  - templates/ingress.yaml
  - templates/hpa.yaml
  - templates/cronjobs.yaml
  - templates/migrations.yaml
  - templates/other-prehooks.yaml
  - templates/role.yaml
  - templates/role-binding.yaml
  - templates/service-account.yaml
  - templates/security-group.yaml
  - templates/secrets-gcp.yaml
tests:
  - it: renders exactly the StatefulSet, nothing else
    asserts:
      - hasDocuments:
          count: 1
        template: templates/statefulset.yaml
      - isKind:
          of: StatefulSet
        template: templates/statefulset.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/service.yaml
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/hpa.yaml
      - hasDocuments:
          count: 0
        template: templates/cronjobs.yaml
      - hasDocuments:
          count: 0
        template: templates/migrations.yaml
      - hasDocuments:
          count: 0
        template: templates/other-prehooks.yaml
      - hasDocuments:
          count: 0
        template: templates/role.yaml
      - hasDocuments:
          count: 0
        template: templates/role-binding.yaml
      - hasDocuments:
          count: 0
        template: templates/service-account.yaml
      - hasDocuments:
          count: 0
        template: templates/security-group.yaml
      - hasDocuments:
          count: 0
        template: templates/secrets-gcp.yaml
