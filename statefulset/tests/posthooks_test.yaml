suite: posthooks
templates:
  - templates/posthooks.yaml
values:
  - ../../ci/scenarios/statefulset/aws-full.yaml
tests:
  - it: no posthooks configured renders nothing
    asserts:
      - hasDocuments:
          count: 0

  - it: an enabled entry renders as a post-install,post-upgrade hook with hook-succeeded delete policy
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
          command: ["/usr/local/bin/curl"]
          args: ["-f", "http://localhost:8080/healthz"]
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-smoke-test
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: hook-succeeded
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/usr/local/bin/curl"]
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-f", "http://localhost:8080/healthz"]
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: a disabled entry renders nothing
    set:
      global.posthooks:
        - name: smoke-test
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: an explicit weight overrides the "0" default, letting multiple posthooks order themselves
    set:
      global.posthooks:
        - name: warm-cache
          enabled: true
          weight: "10"
        - name: notify-slack
          enabled: true
          weight: "20"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "10"
        documentIndex: 0
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "20"
        documentIndex: 1

  - it: the container name is the release name, not the chart name (same convention as prehooks, B11)
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: RELEASE-NAME

  - it: per-job resources override the shared deployment.resources default
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
          resources:
            requests:
              cpu: 5m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 5m

  - it: falls back to global.deployment.resources when the entry has none of its own
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi

  - it: backoffLimit passes through when set, omitted otherwise
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
          backoffLimit: 2
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2

  - it: serviceAccountName is omitted when the ServiceAccount is disabled (same B6 convention as prehooks/cronjobs)
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
      global.security.serviceAccount.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: configMap volume and mount are present when configMap is enabled
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: app-config
            configMap:
              name: app-config
              items:
                - key: .env.prod
                  path: .env.prod
              defaultMode: 420
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: app-config
            readOnly: true
            mountPath: /var/www/html
            subPath: .env.prod

  - it: k8sSecrets.common injects a secretKeyRef env var into the posthook container
    set:
      global.posthooks:
        - name: smoke-test
          enabled: true
      global.k8sSecrets.common.enabled: true
      global.k8sSecrets.common.secretName: shared-secrets
      global.k8sSecrets.common.keys:
        - key: API_KEY
          envName: API_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: shared-secrets
                key: API_KEY
