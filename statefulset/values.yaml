# Real Helm defaults for the StatefulSet umbrella chart.
#
# Every *.enabled defaults to false, every map to {}, every list to [].
# This file exists purely so an unguarded `.Values.global.X` deref in a
# template stops nil-pointering when a value isn't supplied — it must
# never, on its own, cause anything beyond the StatefulSet itself to
# render. See values-example.yaml for a realistic, fully-populated
# reference configuration.
#
# Unlike the Deployment chart: no `deployment.strategy` key (StatefulSet
# hardcodes its own updateStrategy) and `pvc` has no `enabled` — a
# StatefulSet's volumeClaimTemplates are unconditional (README calls PVC
# mandatory for this chart), so its mountPath/subPath/size/storageClass
# are always dereferenced directly, never behind a guard.
global:
  destination: aws

  # Object name override, highest precedence first. Both null -> plain
  # .Release.Name, unchanged from before either key existed.
  fullnameOverride: null
  nameOverride: null

  deployment:
    # Whether the Deployment workload object renders at all. Default true
    # (byte-identical to before P7 existed) -- flip to false only together
    # with rollout.enabled: true (mutually exclusive, enforced by a `fail`
    # at render time if both are true).
    enabled: true
    image:
      uri: ""
      pullPolicy: IfNotPresent
      imagePullSecrets: []
      command: []
      args: []
    env: []
    replicaCount: 1
    resources: {}
    readiness: {}
    liveness: {}
    podAnnotations: {}
    lifecycle: {}
    deregistrationTime: 30
    failSeconds: 600
    revisionHistory: 10
    # DNS resolver ndots. Defaults to 5 (Kubernetes' own default), rendered
    # explicitly as dnsConfig on every pod. Override it from your values with an
    # integer: lower it (e.g. 2 stops short external names from walking the whole
    # search path) or raise it; 0 is valid. Set `ndots: null` to omit dnsConfig
    # entirely (pods then still get Kubernetes' default of 5). NOTE: the explicit
    # default changes the pod template, so upgrading to a chart that ships this
    # default rolls every workload once.
    ndots: 5
    # Pod-spec-level overrides — all null by default, reproducing today's
    # hardcoded literals exactly. podManagementPolicy/updateStrategyPartition
    # only affect the statefulset chart (no equivalent concept on a
    # Deployment/Rollout); dnsPolicy/schedulerName apply to every pod spec
    # in both charts.
    dnsPolicy: null
    schedulerName: null
    podManagementPolicy: null
    updateStrategyPartition: null
    nodeSelector: {}
    affinity: {}
    tolerations: []
    topologySpreadConstraints: []

  # Argo Rollouts has no StatefulSet controller -- this key exists here
  # only so the values contract stays documented identically across all
  # three charts (see common/values.yaml and deployment/values.yaml for
  # the real, deployment-chart-only rollout.* schema). Setting this true
  # on the statefulset chart fails the render immediately (see
  # charts-common.rolloutUnsupported), rather than silently doing nothing.
  rollout:
    enabled: false

  service:
    enabled: false
    annotations: {}
    type: ClusterIP
    ports: {}

  ingress: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: null
    targetMemoryUtilizationPercentage: null
    behavior: {}

  # PodDisruptionBudget. Off by default (no PDB rendered at all). When
  # enabled, set exactly one of minAvailable / maxUnavailable -- an integer
  # or a percentage string like "50%". Selects this release's own pods, so it
  # works for a Deployment, StatefulSet and Argo Rollout alike.
  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: null
    # IfHealthyBudget | AlwaysAllow. Needs Kubernetes 1.26+; null omits the field.
    unhealthyPodEvictionPolicy: null

  # NetworkPolicy for this release's own pods. Off by default (nothing renders).
  # `ingress` / `egress` are plain networking.k8s.io/v1 rule lists, passed
  # through verbatim. A direction is controlled only when its key is set
  # (null = untouched); an empty list means "allow nothing". Enforced only if the
  # CNI enforces NetworkPolicy (EKS: VPC CNI network policy must be enabled).
  networkPolicy:
    enabled: false
    ingress: null
    egress: null

  configMap:
    enabled: false
    name: ""
    fileName: ""
    mountPath: ""

  prehooks:
    dbMigrations:
      enabled: false
      command: []
      args: []
    otherPrehooks:
      enabled: false
      command: []
      args: []

  cronjobs: []

  posthooks: []

  security:
    serviceAccount:
      enabled: false
      annotations: {}
      clusterWideAccess: false
      # Only meaningful when clusterWideAccess is true -- overrides the
      # ClusterRole/ClusterRoleBinding's own name (normally the same as
      # the ServiceAccount's). A ClusterRole is cluster-scoped, so two
      # releases sharing a release name in different namespaces would
      # otherwise collide on the exact same object. Null -> unchanged
      # from before this key existed.
      clusterRoleName: null
      rules: []
    sgPolicy:
      enabled: false
      securityGroupId: ""
    podSecurityContext: {}
    securityContext: {}

  pvc:
    mountPath: ""
    subPath: ""
    size: ""
    # Empty -> ["ReadWriteOnce"], today's hardcoded literal (unlike the
    # deployment chart, this has no `enabled` toggle -- volumeClaimTemplates
    # are unconditional here).
    accessModes: []
    storageClass: ""

  secrets:
    enabled: false
    mountPath: ""
    data: []

  k8sSecrets:
    common:
      enabled: false
      secretName: ""
      keys: []
    service:
      enabled: false
      secretName: ""
      keys: []
