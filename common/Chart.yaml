apiVersion: v2
name: charts-common
description: A Helm library chart for shared templates used by Magicorn charts

# Genuinely a library chart now (it wasn't before — this file said "library"
# in its description while being declared `type: application`, which is why
# its templates rendered on their own at all). Every template here is a
# `define` block only; nothing in this chart renders by itself. Consumed
# by both umbrella charts as their single shared dependency.
type: library

version: 1.0.0
appVersion: "0.0.1"
